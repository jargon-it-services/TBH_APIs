version: "3.8"

services:
  api:
    build:
      context: .
      dockerfile: TheBeautyHubAPI/Dockerfile
    container_name: tbh-api
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: ${DB_CONNECTION}
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
